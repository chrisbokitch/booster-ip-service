<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booster IP Service</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<main class="shell">
<header><div><p class="eyebrow">LOCAL ADMINISTRATION</p><h1>Booster IP Service</h1><p class="muted">Source snapshots and normalized network output</p></div><a href="/docs">API documentation</a></header>
<section aria-labelledby="sources-heading"><div class="section-heading"><h2 id="sources-heading">Sources</h2><button id="reload" type="button">Reload status</button></div><div id="sources" class="source-grid" aria-live="polite">Loading sources…</div></section>
<section aria-labelledby="output-heading"><div class="section-heading"><h2 id="output-heading">Combined output</h2><span id="summary" class="muted"></span></div>
<div class="output-layout"><aside class="output-settings" aria-label="Output settings"><h3>Output settings</h3><div class="source-filter"><div class="filter-heading"><strong>Include sources</strong><button id="select-all" type="button">Select all enabled</button></div><div id="source-selection" class="source-options" aria-label="Sources to include"></div></div>
<div class="controls"><label>Format<select id="format"><option value="cidr">CIDR blocks</option><option value="ip">Individual IPs</option></select></label><label>Address family<select id="family"><option value="all">IPv4 + IPv6</option><option value="ipv4">IPv4</option><option value="ipv6">IPv6</option></select></label><div class="page-size-control"><span class="control-label">Page size</span><div class="page-presets" role="group" aria-label="Page size presets"><button type="button" class="page-preset active" data-limit="1000" aria-pressed="true">1,000</button><button type="button" class="page-preset" data-limit="10000" aria-pressed="false">10,000</button><button type="button" class="page-preset" data-limit="custom" aria-pressed="false">Custom</button></div><label id="custom-limit-wrap" hidden>Custom page size<input id="limit" type="number" min="1" max="1000000" step="1" value="1000" required></label></div></div>
</aside><div class="output-results"><div class="actions"><button id="copy" type="button">Copy page</button><button id="download" type="button">Download page</button><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button></div>
<p id="message" role="status" aria-live="polite" class="muted"></p><textarea id="output" readonly spellcheck="false" aria-label="Normalized output"></textarea><p class="muted small">Copy and download operate on the displayed page. Refreshing sources updates the stored snapshots.</p>
</div></div>
</section>
</main>
</body></html>
