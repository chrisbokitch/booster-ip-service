<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booster IP Service</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<main class="shell">
<header><div><p class="eyebrow">LOCAL ADMINISTRATION</p><h1>Booster IP Service</h1><p class="muted">Source snapshots and normalized network output</p></div><a href="/docs">API documentation</a></header>
<section aria-labelledby="sources-heading"><div class="section-heading"><h2 id="sources-heading">Sources</h2><button id="reload" type="button">Reload status</button></div><div id="sources" class="source-grid" aria-live="polite">Loading sources…</div></section>
<section aria-labelledby="output-heading"><div class="section-heading"><h2 id="output-heading">Combined output</h2><span id="summary" class="muted"></span></div>
<div class="controls"><label>Format<select id="format"><option value="cidr">CIDR blocks</option><option value="ip">Individual IPs</option></select></label><label>Address family<select id="family"><option value="all">IPv4 + IPv6</option><option value="ipv4">IPv4</option><option value="ipv6">IPv6</option></select></label><label>Page size<select id="limit"><option value="1000">1,000</option><option value="10000">10,000</option><option value="100">100</option></select></label></div>
<div class="actions"><button id="copy" type="button">Copy page</button><button id="download" type="button">Download page</button><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button></div>
<p id="message" role="status" aria-live="polite" class="muted"></p><textarea id="output" readonly spellcheck="false" aria-label="Normalized output"></textarea><p class="muted small">Copy and download operate on the displayed page. Refreshing sources updates the stored snapshots.</p>
</section>
</main>
</body></html>
